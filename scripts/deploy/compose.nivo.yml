services:
  nivo-site:
    image: ${NIVO_CADDY_IMAGE:-caddy:2-alpine}
    container_name: nivo-site
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./www:/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
      - /tmp
    networks: [proxy]
networks:
  proxy:
    external: true
    name: proxy_newapi-network
