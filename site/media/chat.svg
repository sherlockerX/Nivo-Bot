<text x="672" y="149" font-size="24" fill="#21453b" font-weight="600">AI对话</text><text x="977" y="147" font-size="22" fill="#21453b" font-weight="400">···</text><rect x="699" y="220" width="300" height="72" rx="18" fill="#e4ebda"/><text x="720" y="251" font-size="20" fill="#21453b" font-weight="400">想每天读一点书，</text><text x="720" y="278" font-size="20" fill="#21453b" font-weight="400">先从今天的一章开始。</text><rect x="670" y="325" width="327" height="86" rx="18" fill="#f0f0e7"/><text x="690" y="358" font-size="20" fill="#21453b" font-weight="400">先把‘读一章’放进待办，</text><text x="690" y="387" font-size="20" fill="#21453b" font-weight="400">再留25分钟给自己。</text><rect x="670" y="444" width="327" height="110" rx="18" fill="#e1e8dc"/><text x="692" y="478" font-size="21" fill="#21453b" font-weight="600">✓  读一章，留下一句笔记</text><text x="692" y="512" font-size="15" fill="#637c6c" font-weight="400">个人成长 · 阅读 · 已保存</text><rect x="670" y="599" width="327" height="52" rx="18" fill="#f0f0e7"/><text x="687" y="631" font-size="17" fill="#7a8275" font-weight="400">和你的AI说点什么…</text>
