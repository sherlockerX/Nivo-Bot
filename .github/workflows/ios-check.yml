name: iOS · build check

# Compiles the iOS app on a Mac runner without signing and without Apple credentials: the way
# to find out whether android/src/ios still builds (the tree is written on Linux) before
# spending an App Store Connect upload on it. Runs on every pull request that touches the iOS
# tree, and by hand from the Actions tab for anything else (a dependency script under
# android/deps/, say). The native dependencies take the better part of an hour the first time;
# the cache is shared with ios-testflight.yml, so a green check makes the next TestFlight run
# cheap. No secrets: CODE_SIGNING_ALLOWED=NO, so a fork's pull request can run it too.

on:
  # Mosaic fork: the iOS port is pushed straight to master, so every push of iOS code is checked.
  push:
    branches: [master, 'codex/ios-parity-*']
    paths:
      - 'android/src/ios/**'
      - 'android/deps/**'
      - '.github/workflows/ios-check.yml'
  pull_request:
    paths:
      - 'android/src/ios/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:
    inputs:
      portable_only:
        description: '只运行便携核心和原生协议回归，用于修复前后的快速验证'
        required: false
        type: boolean
        default: false

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable Swift regression tests
    # 官方提示arm64容量紧张，使用支持相同Xcode版本的标准Intel执行器。
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      # 原生入口回归只需要iSH接口头文件，不构建内核或访问真实地图服务。
      - name: Map command protocol regression tests
        run: |
          set -euo pipefail
          git submodule update --init android/deps/ish
          mkdir -p android/src/ios/build
          xcrun --sdk macosx clang \
            -fobjc-arc -fblocks -std=gnu11 -mmacosx-version-min=13.0 \
            -Wall -Wextra -Werror -Wno-nullability-completeness -Wno-deprecated-declarations \
            -Iandroid/src/ios/NanoMuse -Iandroid/deps/ish \
            android/src/ios/NanoMuse/NivoMapsRequest.m \
            android/src/ios/MinisTests/NivoMapsProtocolHarness.m \
            -framework Foundation -framework MapKit -framework CoreLocation \
            -o android/src/ios/build/nivo-maps-check
          android/src/ios/build/nivo-maps-check 2>&1 | tee android/src/ios/build/maps-tests.log
      # 核心回归与应用构建独立执行，任何一项失败仍使整个工作流失败。
      - name: Portable Swift regression tests
        working-directory: android/src/ios
        run: |
          set -o pipefail
          mkdir -p build
          swift test -Xswiftc -warnings-as-errors 2>&1 | tee build/swift-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # 核心测试的原始输出仍在作业日志中，归档服务中断不改变测试结果。
        continue-on-error: true
        with:
          name: ios-core-log-${{ github.run_number }}
          path: |
            android/src/ios/build/swift-tests.log
            android/src/ios/build/maps-tests.log
          retention-days: 7
          if-no-files-found: warn

  build:
    name: xcodebuild (unsigned)
    # 手动请求快速回归时跳过应用构建，PR和默认手动检查仍完整编译应用。
    if: github.event_name != 'workflow_dispatch' || inputs.portable_only != true
    runs-on: macos-26-intel
    timeout-minutes: 150
    env:
      GO_VERSION: "1.25"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - name: Homebrew packages (iSH kernel and rootfs tooling)
        run: brew install ninja meson llvm lld libarchive pkg-config

      - name: Build-time configuration
        working-directory: android/src/ios
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Pinned iSH revision
        id: ish
        run: echo "rev=$(git rev-parse HEAD:android/deps/ish)" >> "$GITHUB_OUTPUT"

      - name: Native dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/deps/libs
            android/deps/include
            android/deps/resources
            android/deps/frameworks
            android/deps/lame-build
          # 缓存均为固定arm64设备/模拟器产物和头文件，不包含宿主可执行工具。
          key: ios-deps-${{ runner.os }}-${{ steps.ish.outputs.rev }}-${{ hashFiles('android/deps/*.sh', 'android/deps/ffmpeg-patch/**', 'android/deps/rclone-mobile/**') }}

      # 固定发行源码包单独缓存，后续原生库失败也不必再次依赖FFmpeg主站。
      - name: Restore verified FFmpeg source archive
        id: ffmpeg-source-cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/deps/.cache/ffmpeg/ffmpeg-6.1.2.tar.xz
          key: ffmpeg-source-6.1.2-3b624649725ecdc565c903ca6643d41f33bd49239922e45c9b1442c63dca4e38

      - name: Native dependencies (LAME → FFmpeg → iSH → Alpine rootfs → rclone)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Save verified FFmpeg source archive
        if: always() && steps.ffmpeg-source-cache.outputs.cache-hit != 'true' && hashFiles('android/deps/.cache/ffmpeg/ffmpeg-6.1.2.tar.xz') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/deps/.cache/ffmpeg/ffmpeg-6.1.2.tar.xz
          key: ffmpeg-source-6.1.2-3b624649725ecdc565c903ca6643d41f33bd49239922e45c9b1442c63dca4e38

      # 依赖成功后立即保存，后续Swift错误不应让下一轮重复构建原生库。
      - name: Save native dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/deps/libs
            android/deps/include
            android/deps/resources
            android/deps/frameworks
            android/deps/lame-build
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build for a device, unsigned
        working-directory: android/src/ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Minis.xcodeproj -scheme Minis -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build/xcodebuild.log | grep -E "error:|/NanoMuse/.*warning:|BUILD|Compiling|Linking" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log

      # nanoMuse: 测试编译会向宿主App嵌入XCTest，提前保存独立副本供安装包使用。
      - name: Preserve unsigned app before test embedding
        working-directory: android/src/ios
        run: |
          mkdir -p build/unsigned/Payload
          ditto build/DerivedData/Build/Products/Debug-iphoneos/Minis.app build/unsigned/Payload/Minis.app

      # 先交付设备应用，稍后的测试编译仍独立决定整次检查是否通过。
      - name: Package unsigned iOS app
        working-directory: android/src/ios/build/unsigned
        run: |
          set -euo pipefail
          test -z "$(find Payload -name '*.xctest' -print -quit)"
          zip -qry ../Nivo-Bot-unsigned.ipa Payload
          cd ..
          shasum -a 256 Nivo-Bot-unsigned.ipa > Nivo-Bot-unsigned.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nivo-ios-unsigned-${{ github.run_number }}
          path: |
            android/src/ios/build/Nivo-Bot-unsigned.ipa
            android/src/ios/build/Nivo-Bot-unsigned.sha256
          retention-days: 14
          if-no-files-found: error

      # 编译真实应用测试目标，系统Keychain及UI运行仍需设备或模拟器的独立验收。
      - name: Compile application tests, unsigned
        working-directory: android/src/ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Minis.xcodeproj -scheme Minis -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee build/xcodebuild-tests.log | grep -E "error:|/NanoMuse/.*warning:|BUILD|Compiling|Linking" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/xcodebuild-tests.log

      # docs/ios.md: the device build must finish with zero warnings in NanoMuse/. Upstream's
      # files are theirs; ours are held to the bar here, so a warning cannot sit on main unnoticed.
      - name: Zero warnings in NanoMuse/
        working-directory: android/src/ios
        run: |
          if grep -hE "/NanoMuse/[^:]+:[0-9]+:[0-9]+: warning:" build/xcodebuild.log build/xcodebuild-tests.log | sort -u | tee build/nanomuse-warnings.txt | grep -q .; then
            echo "::error::warnings in NanoMuse/ (see above)"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: ios-check-log-${{ github.run_number }}
          path: |
            android/src/ios/build/xcodebuild.log
            android/src/ios/build/xcodebuild-tests.log
          retention-days: 7
          if-no-files-found: warn
